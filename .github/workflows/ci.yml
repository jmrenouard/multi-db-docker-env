name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    env:
      # Temporary override to suppress GitHub Actions runner Node 16/20 deprecation warnings.
      # Can be safely removed once all action dependencies natively run on Node 20+.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate and Check TLS Certificates
        run: |
          make gen-ssl-all
          make check-ssl-all

      - name: Validate Configuration & Environment
        run: |
          make test-config

      - name: Verify Backup & Restore Procedures
        run: |
          make test-backup-restore

      - name: Run Failover Tests
        run: |
          make test-failover

      - name: Download and Setup MySQLTuner
        run: |
          curl -fsSL https://raw.githubusercontent.com/major/MySQLTuner-perl/v2.6.0/mysqltuner.pl -o mysqltuner.pl || curl -fsSL https://raw.githubusercontent.com/major/MySQLTuner-perl/master/mysqltuner.pl -o mysqltuner.pl
          chmod +x mysqltuner.pl

      - name: Run MySQLTuner E2E Integration Audit
        env:
          MYSQLTUNER_PATH: ./mysqltuner.pl
        run: |
          make mysqltuner-galera

      - name: Aggregate Test Reports
        run: |
          make test-all-report

      - name: Upload Test Reports Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/
