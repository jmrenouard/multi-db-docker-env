name: Documentation CI

on:
  push:
    branches: ["main"]
    paths: ["docs/**", "documentation/**", "mkdocs.yml", "README.md", "README_fr.md", "Changelog", "requirements-docs.txt", ".vale.ini", ".markdownlint.json", "scripts/mkdocs_hooks.py", "scripts/build_versioned_docs.py", ".github/workflows/docs-ci.yml", "tests/test_diataxis_documentation.py", "tests/test_mkdocs_publishing.py", "tests/test_docs_hygiene.py"]
  pull_request:
    branches: ["main"]
    paths: ["docs/**", "documentation/**", "mkdocs.yml", "README.md", "README_fr.md", "Changelog", "requirements-docs.txt", ".vale.ini", ".markdownlint.json", "scripts/mkdocs_hooks.py", "scripts/build_versioned_docs.py", ".github/workflows/docs-ci.yml", "tests/test_diataxis_documentation.py", "tests/test_mkdocs_publishing.py", "tests/test_docs_hygiene.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-quality:
    name: Validate Diataxis, Links, Math, and MkDocs Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-docs.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt pyyaml
      - name: Run documentation tests
        run: python -W error::ResourceWarning -m unittest tests/test_docs_hygiene.py tests/test_diataxis_documentation.py tests/test_mkdocs_publishing.py -v
      - name: Build MkDocs site strictly
        run: mkdocs build --strict
