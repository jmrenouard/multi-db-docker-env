name: Release & Distribution

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  package-release-assets:
    name: Package Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Laboratory Distribution Archives
        run: |
          mkdir -p dist
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="${GITHUB_REF_NAME:-v2.0.0}"
          fi
          ARCHIVE_BASE="multi-db-docker-env-${TAG_NAME}"

          # Create distribution directory excluding local caches and git metadata
          TMP_DIR=$(mktemp -d)
          PACKAGE_DIR="${TMP_DIR}/${ARCHIVE_BASE}"
          mkdir -p "${PACKAGE_DIR}"

          # Copy essential compose files, configurations, scripts, and documentation
          cp -r docker-compose*.yml Dockerfile Makefile VERSION README.md LICENSE "${PACKAGE_DIR}/"
          cp -r conf scripts pkg cmd "${PACKAGE_DIR}/" 2>/dev/null || true
          cp .env.example "${PACKAGE_DIR}/" 2>/dev/null || true

          # Create tar.gz and zip bundles
          tar -czf "dist/${ARCHIVE_BASE}.tar.gz" -C "${TMP_DIR}" "${ARCHIVE_BASE}"
          (cd "${TMP_DIR}" && zip -rq "${GITHUB_WORKSPACE}/dist/${ARCHIVE_BASE}.zip" "${ARCHIVE_BASE}")
          rm -rf "${TMP_DIR}"

          # Generate cryptographic checksums
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            dist/*

  publish-docker-hub:
    name: Build & Push Multi-Arch Docker Hub Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Docker Hub Image Tags
        id: meta
        run: |
          IMAGE="jmrenouard/multi-db-docker-env"
          RAW_TAG="${{ github.event.release.tag_name }}"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="${GITHUB_REF_NAME:-v2.0.0}"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"

          TAGS="${IMAGE}:${RAW_TAG},${IMAGE}:${CLEAN_VERSION}"

          # Conditionally append :latest tag only if release is not a prerelease
          IS_PRERELEASE="${{ github.event.release.prerelease }}"
          if [ "$IS_PRERELEASE" != "true" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
