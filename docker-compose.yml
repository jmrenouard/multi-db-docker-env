x-pfs-command: &pfs-command
  - "--performance-schema=ON"
  - "--performance-schema-events-transactions-history-size=2000"
  - "--performance-schema-events-transactions-history-long-size=50000"
  - "--performance-schema-consumer-events-transactions-history=ON"
  - "--performance-schema-consumer-events-transactions-history-long=ON"

services:
  # --- Reverse Proxy (Traefik) ---
  traefik:
    image: traefik:v3
    container_name: traefik-db-proxy
    profiles:
      [
        "traefik",
        "mysql97",
        "mysql84",
        "mariadb123",
        "mariadb118",
        "mariadb114",
        "mariadb1011",
        "percona84",
        "postgres18",
        "postgres17",
        "postgres16",
        "postgres15",
      ]
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.mysql.address=:3306"
      - "--entrypoints.postgres.address=:5432"
    ports:
      - "${TRAEFIK_MYSQL_PORT:-3306}:3306"
      - "${TRAEFIK_PG_PORT:-5432}:5432"
      - "${TRAEFIK_DASHBOARD_PORT:-8088}:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - db-network

  # --- Standalone MySQL Matrix (LTS) ---
  mysql97:
    image: mysql:9.7
    container_name: mysql-9.7
    profiles: ["mysql97"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_9_7_data:/var/lib/mysql
    command: *pfs-command
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.db-router.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.db-router.entrypoints=mysql"
      - "traefik.tcp.routers.db-router.service=db-service"
      - "traefik.tcp.services.db-service.loadbalancer.server.port=3306"
    networks:
      - db-network

  mysql84:
    image: mysql:8.4
    container_name: mysql-8.4
    profiles: ["mysql84"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_8_4_data:/var/lib/mysql
    command: *pfs-command
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.db-router.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.db-router.entrypoints=mysql"
      - "traefik.tcp.routers.db-router.service=db-service"
      - "traefik.tcp.services.db-service.loadbalancer.server.port=3306"
    networks:
      - db-network

  # --- MariaDB Matrix (LTS) ---
  mariadb123:
    image: mariadb:12.3
    container_name: mariadb-12.3
    profiles: ["mariadb123"]
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb_12_3_data:/var/lib/mysql
    command: *pfs-command
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.db-router.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.db-router.entrypoints=mysql"
      - "traefik.tcp.routers.db-router.service=db-service"
      - "traefik.tcp.services.db-service.loadbalancer.server.port=3306"
    networks:
      - db-network
  mariadb118:
    image: mariadb:11.8
    container_name: mariadb-11.8
    profiles: ["mariadb118"]
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb_11_8_data:/var/lib/mysql
    command: *pfs-command
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.db-router.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.db-router.entrypoints=mysql"
      - "traefik.tcp.routers.db-router.service=db-service"
      - "traefik.tcp.services.db-service.loadbalancer.server.port=3306"
    networks:
      - db-network

  mariadb114:
