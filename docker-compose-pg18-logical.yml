networks:
  pg18_logical_net:
    driver: bridge

x-pg18-logical-common: &pg18-logical-common
  image: postgres:18
  restart: unless-stopped
  environment:
    POSTGRES_USER: ${PG_USER:-postgres}
    POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-${PG_LAB_PASSWORD:-pg_poc_ephemeral}}
    POSTGRES_DB: ${PG_DB:-labdb}
  command:
    - postgres
    - -c
    - wal_level=logical
    - -c
    - track_commit_timestamp=on
    - -c
    - max_wal_senders=10
    - -c
    - max_replication_slots=10
    - -c
    - max_logical_replication_workers=8
    - -c
    - max_worker_processes=12
    - -c
    - wal_keep_size=128MB
    - -c
    - shared_buffers=128MB
    - -c
    - log_error_verbosity=verbose
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 3s
    timeout: 3s
    retries: 15
  networks:
    - pg18_logical_net

services:
  pg18_logical_pub:
    <<: *pg18-logical-common
    container_name: pg18_logical_pub
    hostname: pg18_logical_pub
    ports:
      - "127.0.0.1:15536:5432"
    volumes:
      - pg18_logical_pub_data:/var/lib/postgresql

  pg18_logical_sub:
    <<: *pg18-logical-common
    container_name: pg18_logical_sub
    hostname: pg18_logical_sub
    ports:
      - "127.0.0.1:15537:5432"
    volumes:
      - pg18_logical_sub_data:/var/lib/postgresql
    depends_on:
      pg18_logical_pub:
        condition: service_healthy

volumes:
  pg18_logical_pub_data:
  pg18_logical_sub_data:
