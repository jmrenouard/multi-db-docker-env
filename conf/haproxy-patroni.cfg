global
    log stdout format raw local0
    stats socket /tmp/haproxy.sock mode 660 level admin

    ssl-default-bind-ciphers HIGH:!aNULL:!MD5
    ssl-default-server-ciphers HIGH:!aNULL:!MD5

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5000
    timeout client  50000
    timeout server  50000

listen stats
    bind *:7000 ssl crt /certs/haproxy.pem
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats auth "admin:adminpass"
    stats admin if TRUE

frontend pg_write
    bind *:5000
    default_backend pg_primary

frontend pg_read
    bind *:5001
    default_backend pg_replicas

backend pg_primary
    option httpchk
    http-check connect port 8008 ssl
    http-check send meth GET uri /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none resolvers docker
    server node1 node1:5432 check port 8008 check-ssl verify required ca-file /certs/ca.crt crt /certs/haproxy.pem weight 100
    server node2 node2:5432 check port 8008 check-ssl verify required ca-file /certs/ca.crt crt /certs/haproxy.pem weight 100
    server node3 node3:5432 check port 8008 check-ssl verify required ca-file /certs/ca.crt crt /certs/haproxy.pem weight 100

backend pg_replicas
    option httpchk
    http-check connect port 8008 ssl
    http-check send meth GET uri /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none resolvers docker
    server node1 node1:5432 check port 8008 check-ssl verify required ca-file /certs/ca.crt crt /certs/haproxy.pem weight 100
    server node2 node2:5432 check port 8008 check-ssl verify required ca-file /certs/ca.crt crt /certs/haproxy.pem weight 100
    server node3 node3:5432 check port 8008 check-ssl verify required ca-file /certs/ca.crt crt /certs/haproxy.pem weight 100
