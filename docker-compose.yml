networks:
  db-network:
    driver: bridge

volumes:
  mysql_9_7_data:
  mysql_8_4_data:
  mariadb_12_3_data:
  mariadb_11_8_data:
  mariadb_11_4_data:
  mariadb_10_11_data:
  percona_8_4_data:
  postgres_18_data:
  postgres_17_data:
  postgres_16_data:
  postgres_15_data:
