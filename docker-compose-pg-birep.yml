networks:
  pg_birep_net:
    driver: bridge

x-pg-birep-common: &pg-birep-common
  image: postgres:17
  restart: unless-stopped
  environment:
    POSTGRES_USER: ${PG_USER:-postgres}
    POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-${PG_LAB_PASSWORD:-pg_poc_ephemeral}}
    POSTGRES_DB: ${PG_DB:-labdb}
  command:
    - postgres
    - -c
    - wal_level=logical
    - -c
    - track_commit_timestamp=on
    - -c
    - max_wal_senders=10
    - -c
    - max_replication_slots=10
    - -c
    - max_logical_replication_workers=${PG_MAX_LOGICAL_REPLICATION_WORKERS:-8}
    - -c
    - max_worker_processes=${PG_MAX_WORKER_PROCESSES:-16}
    - -c
    - logical_decoding_work_mem=${PG_LOGICAL_DECODING_WORK_MEM:-256MB}
    - -c
    - max_parallel_apply_workers_per_subscription=${PG_MAX_PARALLEL_APPLY_WORKERS:-4}
    - -c
    - wal_keep_size=${PG_WAL_KEEP_SIZE:-256MB}
    - -c
    - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
    - -c
    - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}
    - -c
    - work_mem=${PG_WORK_MEM:-16MB}
    - -c
    - maintenance_work_mem=${PG_MAINT_WORK_MEM:-128MB}
    - -c
    - max_connections=${PG_MAX_CONNECTIONS:-200}
    - -c
    - wal_compression=${PG_WAL_COMPRESSION:-lz4}
    - -c
    - wal_buffers=${PG_WAL_BUFFERS:-16MB}
    - -c
    - max_wal_size=${PG_MAX_WAL_SIZE:-2GB}
    - -c
    - min_wal_size=${PG_MIN_WAL_SIZE:-512MB}
    - -c
    - checkpoint_completion_target=${PG_CHECKPOINT_COMPLETION_TARGET:-0.9}
    - -c
    - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
    - -c
    - effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-16}
    - -c
    - jit=${PG_JIT:-off}
    - -c
    - log_error_verbosity=verbose
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 3s
    timeout: 3s
    retries: 15
  networks:
    - pg_birep_net

services:
  pg_birep_node1:
    <<: *pg-birep-common
    container_name: pg_birep_node1
    hostname: pg_birep_node1
    ports:
      - "127.0.0.1:15441:5432"
    volumes:
      - pg_birep_data1:/var/lib/postgresql/data

  pg_birep_node2:
    <<: *pg-birep-common
    container_name: pg_birep_node2
    hostname: pg_birep_node2
    ports:
      - "127.0.0.1:15442:5432"
    volumes:
      - pg_birep_data2:/var/lib/postgresql/data

  haproxy_pg_birep:
    image: haproxy:lts-alpine
    container_name: haproxy_pg_birep
    hostname: haproxy_pg_birep
    restart: unless-stopped
    ports:
      - "127.0.0.1:15440:5432"
      - "127.0.0.1:15449:8404"
    volumes:
      - ./scripts/pg_birep/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      pg_birep_node1:
        condition: service_healthy
      pg_birep_node2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8404/stats >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pg_birep_net

volumes:
  pg_birep_data1:
  pg_birep_data2:
