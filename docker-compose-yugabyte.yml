networks:
  yb_net:
    driver: bridge

x-yb: &yb
  image: yugabytedb/yugabyte:2026.1.3.0-b100
  user: "0:0"
  restart: unless-stopped
  mem_limit: ${YB_MEM_LIMIT:-3072m}
  entrypoint:
    - /bin/bash
    - -c
    - >
      mkdir -p /home/yugabyte/var && chown -R 10001:100 /home/yugabyte/var &&
      exec /sbin/tini -- /usr/sbin/runuser -u yugabyte --
      /home/yugabyte/bin/yugabyted start --background=false --callhome=false --insecure
      --advertise_address="$$YB_NODE" --cloud_location="local.dc1.$$YB_ZONE" --fault_tolerance=zone
      --base_dir=/home/yugabyte/var $${YB_JOIN:+--join=$$YB_JOIN}
      --master_flags=memory_limit_hard_bytes=${YB_MASTER_MEM_BYTES:-536870912},yb_enable_read_committed_isolation=${YB_ENABLE_RC:-true},enable_wait_queues=${YB_WAIT_QUEUES:-true},yb_num_shards_per_tserver=${YB_SHARDS_PER_TSERVER:-1}
      --tserver_flags="memory_limit_hard_bytes=${YB_TSERVER_MEM_BYTES:-1610612736},yb_enable_read_committed_isolation=${YB_ENABLE_RC:-true},enable_wait_queues=${YB_WAIT_QUEUES:-true},ysql_enable_packed_row=${YB_PACKED_ROW:-true},yb_num_shards_per_tserver=${YB_SHARDS_PER_TSERVER:-1},ysql_num_shards_per_tserver=${YB_YSQL_SHARDS_PER_TSERVER:-1},ysql_max_connections=${YB_YSQL_MAX_CONN:-300},ysql_pg_conf_csv={yb_enable_cbo=on,jit=off}"

services:
  yb_node1:
    <<: *yb
    container_name: yb_node1
    hostname: yb-node1
    environment: { YB_NODE: yb-node1, YB_ZONE: zone1 }
    ports: ["127.0.0.1:15471:5433","127.0.0.1:17001:7000"]
    volumes: [yb_data1:/home/yugabyte/var]
    networks: { yb_net: { aliases: [yb-node1] } }
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/yb-node1/5433 && </dev/tcp/yb-node1/7000'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  yb_node2:
    <<: *yb
    container_name: yb_node2
    hostname: yb-node2
    environment: { YB_NODE: yb-node2, YB_ZONE: zone2, YB_JOIN: yb-node1 }
    ports: ["127.0.0.1:15472:5433"]
    volumes: [yb_data2:/home/yugabyte/var]
    networks: { yb_net: { aliases: [yb-node2] } }
    depends_on: { yb_node1: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/yb-node2/5433 && </dev/tcp/yb-node2/7000'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  yb_node3:
    <<: *yb
    container_name: yb_node3
    hostname: yb-node3
    environment: { YB_NODE: yb-node3, YB_ZONE: zone3, YB_JOIN: yb-node1 }
    ports: ["127.0.0.1:15473:5433"]
    volumes: [yb_data3:/home/yugabyte/var]
    networks: { yb_net: { aliases: [yb-node3] } }
    depends_on: { yb_node2: { condition: service_healthy } }

  haproxy_yugabyte:
    image: haproxy:lts-alpine
    container_name: haproxy_yugabyte
    hostname: haproxy_yugabyte
    restart: unless-stopped
    ports: ["127.0.0.1:15470:5433", "127.0.0.1:15479:8404"]
    volumes: ["./scripts/yugabyte/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    depends_on: { yb_node1: { condition: service_healthy } }
    networks: [yb_net]

volumes: { yb_data1: {}, yb_data2: {}, yb_data3: {} }
