networks:
  pgedge_net:
    driver: bridge

x-pgedge-common: &pgedge-common
  image: ghcr.io/pgedge/pgedge-postgres:17-spock5-minimal
  restart: unless-stopped
  entrypoint:
    - bash
    - -c
    - exec /usr/local/bin/docker-entrypoint.sh postgres -c listen_addresses=* -c logging_collector=off -c output_plugin_libraries=pgoutput,spock_output -c wal_level=logical -c track_commit_timestamp=on -c shared_preload_libraries=spock,snowflake -c spock.conflict_resolution=last_update_wins -c spock.enable_ddl_replication=on -c spock.include_ddl_repset=on -c spock.save_resolutions=${SPOCK_SAVE_RESOLUTIONS:-on} -c spock.batch_inserts=${SPOCK_BATCH_INSERTS:-on} -c spock.use_spi=${SPOCK_USE_SPI:-off} -c spock.synchronous_commit=${SPOCK_SYNC_COMMIT:-off} -c spock.feedback_frequency=${SPOCK_FEEDBACK_FREQ:-200} -c max_wal_senders=12 -c max_replication_slots=12 -c max_worker_processes=${PG_MAX_WORKER_PROCESSES:-16} -c max_logical_replication_workers=${PG_MAX_LOGICAL_REPLICATION_WORKERS:-12} -c logical_decoding_work_mem=${PG_LOGICAL_DECODING_WORK_MEM:-256MB} -c shared_buffers=${PG_SHARED_BUFFERS:-512MB} -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB} -c work_mem=${PG_WORK_MEM:-16MB} -c maintenance_work_mem=${PG_MAINT_WORK_MEM:-128MB} -c max_connections=${PG_MAX_CONNECTIONS:-200} -c wal_compression=${PG_WAL_COMPRESSION:-lz4} -c wal_buffers=${PG_WAL_BUFFERS:-16MB} -c max_wal_size=${PG_MAX_WAL_SIZE:-2GB} -c checkpoint_completion_target=${PG_CHECKPOINT_COMPLETION_TARGET:-0.9} -c random_page_cost=${PG_RANDOM_PAGE_COST:-1.1} -c effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-16} -c jit=${PG_JIT:-off} -c log_error_verbosity=verbose -c snowflake.node=$${SNOWFLAKE_NODE}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 3s
    timeout: 3s
    retries: 20
  networks:
    - pgedge_net

services:
  pgedge_node1:
    <<: *pgedge-common
    container_name: pgedge_node1
    hostname: pgedge_node1
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-${PG_LAB_PASSWORD:-pg_poc_ephemeral}}
      POSTGRES_DB: ${PG_DB:-labdb}
      SNOWFLAKE_NODE: "1"
    ports: ["127.0.0.1:15451:5432"]
    volumes: ["pgedge_data1:/var/lib/pgsql/17/data"]

  pgedge_node2:
    <<: *pgedge-common
    container_name: pgedge_node2
    hostname: pgedge_node2
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-${PG_LAB_PASSWORD:-pg_poc_ephemeral}}
      POSTGRES_DB: ${PG_DB:-labdb}
      SNOWFLAKE_NODE: "2"
    ports: ["127.0.0.1:15452:5432"]
    volumes: ["pgedge_data2:/var/lib/pgsql/17/data"]

  pgedge_node3:
    <<: *pgedge-common
    container_name: pgedge_node3
    hostname: pgedge_node3
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-${PG_LAB_PASSWORD:-pg_poc_ephemeral}}
      POSTGRES_DB: ${PG_DB:-labdb}
      SNOWFLAKE_NODE: "3"
    ports: ["127.0.0.1:15453:5432"]
    volumes: ["pgedge_data3:/var/lib/pgsql/17/data"]

  haproxy_pgedge:
    image: haproxy:lts-alpine
    container_name: haproxy_pgedge
    hostname: haproxy_pgedge
    restart: unless-stopped
    ports: ["127.0.0.1:15450:5432"]
    volumes: ["./scripts/pgedge/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    depends_on:
      pgedge_node1: {condition: service_healthy}
      pgedge_node2: {condition: service_healthy}
      pgedge_node3: {condition: service_healthy}
    networks: [pgedge_net]

volumes:
  pgedge_data1:
  pgedge_data2:
  pgedge_data3:
