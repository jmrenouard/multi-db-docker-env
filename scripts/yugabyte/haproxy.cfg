global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s

frontend yugabyte_ysql
    bind *:5433
    default_backend yugabyte_nodes

backend yugabyte_nodes
    balance roundrobin
    option tcp-check
    default-server inter 2s fall 2 rise 2 init-addr last,libc,none resolvers docker
    server yb_node1 yb-node1:5433 check
    server yb_node2 yb-node2:5433 check
    server yb_node3 yb-node3:5433 check
