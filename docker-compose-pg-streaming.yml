networks:
  pg_streaming_net:
    driver: bridge

services:
  pg_stream_primary:
    image: postgres:17
    container_name: pg_stream_primary
    hostname: pg_stream_primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-${PG_LAB_PASSWORD:-pg_poc_ephemeral}}
      POSTGRES_DB: ${PG_DB:-labdb}
    entrypoint:
      - bash
      - -c
      - |
        mkdir -p /docker-entrypoint-initdb.d
        printf 'echo "host replication all all scram-sha-256" >> "$$PGDATA/pg_hba.conf"\n' > /docker-entrypoint-initdb.d/01_rep_hba.sh
        chmod +x /docker-entrypoint-initdb.d/01_rep_hba.sh
        exec /usr/local/bin/docker-entrypoint.sh postgres \
          -c wal_level=replica \
          -c max_wal_senders=10 \
          -c max_replication_slots=10 \
          -c hot_standby=on \
          -c wal_keep_size=${PG_WAL_KEEP_SIZE:-256MB} \
          -c shared_buffers=${PG_SHARED_BUFFERS:-512MB} \
          -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB} \
          -c work_mem=${PG_WORK_MEM:-16MB} \
          -c maintenance_work_mem=${PG_MAINT_WORK_MEM:-128MB} \
          -c max_connections=${PG_MAX_CONNECTIONS:-200} \
          -c wal_compression=${PG_WAL_COMPRESSION:-lz4} \
          -c wal_buffers=${PG_WAL_BUFFERS:-16MB} \
          -c max_wal_size=${PG_MAX_WAL_SIZE:-2GB} \
          -c min_wal_size=${PG_MIN_WAL_SIZE:-512MB} \
          -c checkpoint_completion_target=${PG_CHECKPOINT_COMPLETION_TARGET:-0.9} \
          -c random_page_cost=${PG_RANDOM_PAGE_COST:-1.1} \
          -c effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-16} \
          -c jit=${PG_JIT:-off} \
          -c log_error_verbosity=verbose
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - pg_stream_primary_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - pg_streaming_net

  pg_stream_standby:
    image: postgres:17
    container_name: pg_stream_standby
    hostname: pg_stream_standby
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-${PG_LAB_PASSWORD:-pg_poc_ephemeral}}
      POSTGRES_DB: ${PG_DB:-labdb}
    entrypoint:
      - bash
      - -c
      - |
        if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
          t=0
          until pg_isready -h pg_stream_primary -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"; do
            t=$$((t+1)); [ "$$t" -ge 30 ] && { echo "Primary timeout" >&2; exit 1; }
            sleep 1
          done
          t=0
          until PGPASSWORD="$$POSTGRES_PASSWORD" psql -h pg_stream_primary -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc \
            "SELECT pg_create_physical_replication_slot('slot_stream_standby') WHERE NOT EXISTS (SELECT 1 FROM pg_replication_slots WHERE slot_name='slot_stream_standby');" >/dev/null 2>&1; do
            t=$$((t+1)); [ "$$t" -ge 30 ] && { echo "Slot timeout" >&2; exit 1; }
            sleep 1
          done
          t=0
          until rm -rf /var/lib/postgresql/data/* && PGPASSWORD="$$POSTGRES_PASSWORD" pg_basebackup -h pg_stream_primary -p 5432 -U "$$POSTGRES_USER" -D /var/lib/postgresql/data -Fp -Xs -P -R -S slot_stream_standby; do
            t=$$((t+1)); [ "$$t" -ge 30 ] && { echo "pg_basebackup timeout" >&2; exit 1; }
            sleep 1
          done
          esc_lp() { local s="$${1//\\/\\\\}"; s="$${s//\'/\\\'}"; printf '%s' "$${s// /\\ }"; }
          esc_guc() { local s="$${1//\\/\\\\}"; printf '%s' "$${s//\'/\'\'}"; }
          u_e="$$(esc_guc "$$(esc_lp "$$POSTGRES_USER")")"
          p_e="$$(esc_guc "$$(esc_lp "$$POSTGRES_PASSWORD")")"
          printf "primary_conninfo = 'host=pg_stream_primary port=5432 user=%s password=%s application_name=pg_stream_standby'\n" "$$u_e" "$$p_e" >> /var/lib/postgresql/data/postgresql.auto.conf
          printf "primary_slot_name = 'slot_stream_standby'\n" >> /var/lib/postgresql/data/postgresql.auto.conf
          chown -R postgres:postgres /var/lib/postgresql/data
          chmod 700 /var/lib/postgresql/data
        fi
        exec /usr/local/bin/docker-entrypoint.sh postgres \
          -c hot_standby=on \
          -c shared_buffers=${PG_SHARED_BUFFERS:-512MB} \
          -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB} \
          -c work_mem=${PG_WORK_MEM:-16MB} \
          -c maintenance_work_mem=${PG_MAINT_WORK_MEM:-128MB} \
          -c max_connections=${PG_MAX_CONNECTIONS:-200} \
          -c wal_compression=${PG_WAL_COMPRESSION:-lz4} \
          -c wal_buffers=${PG_WAL_BUFFERS:-16MB} \
          -c max_wal_size=${PG_MAX_WAL_SIZE:-2GB} \
          -c min_wal_size=${PG_MIN_WAL_SIZE:-512MB} \
          -c checkpoint_completion_target=${PG_CHECKPOINT_COMPLETION_TARGET:-0.9} \
          -c random_page_cost=${PG_RANDOM_PAGE_COST:-1.1} \
          -c effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-16} \
          -c jit=${PG_JIT:-off} \
          -c log_error_verbosity=verbose
    ports:
      - "127.0.0.1:15435:5432"
    volumes:
      - pg_stream_standby_data:/var/lib/postgresql/data
    depends_on:
      pg_stream_primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - pg_streaming_net

volumes:
  pg_stream_primary_data:
  pg_stream_standby_data:
