networks:
  citus_net:
    driver: bridge

x-citus-node: &citus-node
  image: citusdata/citus:14.2.0-pg17
  restart: unless-stopped
  mem_limit: 512m
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ${PG_LAB_PASSWORD:-${DB_ROOT_PASSWORD:-pg_poc_ephemeral}}
    POSTGRES_DB: postgres
    PGUSER: postgres
  command:
    - postgres
    - -c
    - shared_preload_libraries=citus
    - -c
    - shared_buffers=128MB
    - -c
    - max_connections=100
    - -c
    - citus.shard_count=8
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres"]
    interval: 5s
    timeout: 5s
    retries: 20
  networks:
    - citus_net

services:
  citus_coord:
    <<: *citus-node
    container_name: citus_coord
    hostname: citus_coord
    ports:
      - "127.0.0.1:15490:5432"
    volumes:
      - citus_coord_data:/var/lib/postgresql/data
    depends_on:
      citus_worker1:
        condition: service_healthy
      citus_worker2:
        condition: service_healthy

  citus_worker1:
    <<: *citus-node
    container_name: citus_worker1
    hostname: citus_worker1
    ports:
      - "127.0.0.1:15491:5432"
    volumes:
      - citus_worker1_data:/var/lib/postgresql/data

  citus_worker2:
    <<: *citus-node
    container_name: citus_worker2
    hostname: citus_worker2
    ports:
      - "127.0.0.1:15492:5432"
    volumes:
      - citus_worker2_data:/var/lib/postgresql/data

volumes:
  citus_coord_data:
  citus_worker1_data:
  citus_worker2_data:
