networks:
  yt_cluster_net:
    driver: bridge

x-yt-common: &yt-common
  image: dbinvent/yt:1.21.3
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
  environment:
    POSTGRES_USER: ${PG_USER:-postgres}
    POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-${PG_LAB_PASSWORD:-pg_poc_ephemeral}}
    POSTGRES_DB: ${PG_DB:-labdb}
    YT_PEERS: "yt1 yt2 yt3"
    YT_CLUSTER: "11111111-2222-4333-8444-555555555555"
    YT_TABLES: "public.%"
    YT_MAX_PREPARED: "${YT_MAX_PREPARED:-300}"
    YT_CONFIG_TRIGGER: "1"
  command:
    - postgres
    - -c
    - shared_buffers=${YT_SHARED_BUFFERS:-512MB}
    - -c
    - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}
    - -c
    - work_mem=${PG_WORK_MEM:-16MB}
    - -c
    - maintenance_work_mem=${PG_MAINT_WORK_MEM:-128MB}
    - -c
    - max_connections=${PG_MAX_CONNECTIONS:-200}
    - -c
    - wal_compression=${PG_WAL_COMPRESSION:-lz4}
    - -c
    - wal_buffers=${PG_WAL_BUFFERS:-16MB}
    - -c
    - max_wal_size=${PG_MAX_WAL_SIZE:-2GB}
    - -c
    - checkpoint_completion_target=${PG_CHECKPOINT_COMPLETION_TARGET:-0.9}
    - -c
    - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
    - -c
    - effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-16}
    - -c
    - jit=${PG_JIT:-off}
    - -c
    - io_method=${PG18_IO_METHOD:-worker}
    - -c
    - io_workers=${PG18_IO_WORKERS:-4}
  healthcheck:
    test:
      - CMD-SHELL
      - "yt-health && psql -q -U postgres -d postgres -tAc \"SELECT count(*) FROM yt_info('o');\" | grep -qE '^[1-9]'"
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 10s
  networks:
    - yt_cluster_net

services:
  yt1:
    <<: *yt-common
    container_name: yt1
    hostname: yt1
    ports:
      - "127.0.0.1:5491:5432"
    volumes:
      - yt1_data:/var/lib/postgresql

  yt2:
    <<: *yt-common
    container_name: yt2
    hostname: yt2
    ports:
      - "127.0.0.1:5492:5432"
    volumes:
      - yt2_data:/var/lib/postgresql

  yt3:
    <<: *yt-common
    container_name: yt3
    hostname: yt3
    ports:
      - "127.0.0.1:5493:5432"
    volumes:
      - yt3_data:/var/lib/postgresql

volumes:
  yt1_data:
  yt2_data:
  yt3_data:
