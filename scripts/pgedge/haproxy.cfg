global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats

frontend pgedge_active_active
    bind *:5432
    default_backend pgedge_nodes

backend pgedge_nodes
    balance roundrobin
    option pgsql-check user postgres
    default-server inter 2s fall 2 rise 2 init-addr last,libc,none resolvers docker
    server pgedge_node1 pgedge_node1:5432 check
    server pgedge_node2 pgedge_node2:5432 check
    server pgedge_node3 pgedge_node3:5432 check
