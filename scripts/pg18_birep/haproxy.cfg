global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s

frontend pg18_birep_active_active
    bind *:5432
    default_backend pg18_birep_nodes

backend pg18_birep_nodes
    balance roundrobin
    option tcp-check
    default-server inter 2s fall 2 rise 2
    server pg18_birep_node1 pg18_birep_node1:5432 check
    server pg18_birep_node2 pg18_birep_node2:5432 check
