global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s

frontend cockroach_sql
    bind *:26257
    default_backend cockroach_nodes

backend cockroach_nodes
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health?ready=1
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 init-addr last,libc,none resolvers docker
    server crdb_node1 crdb_node1:26257 check port 8080
    server crdb_node2 crdb_node2:26257 check port 8080
    server crdb_node3 crdb_node3:26257 check port 8080
