networks:
  yb_net:
    driver: bridge

x-yb: &yb
  image: yugabytedb/yugabyte:2026.1.3.0-b100
  user: "0:0"
  restart: unless-stopped
  mem_limit: 2048m
  entrypoint:
    - /bin/bash
    - -c
    - >
      mkdir -p /home/yugabyte/var && chown -R 10001:100 /home/yugabyte/var &&
      exec /sbin/tini -- /usr/sbin/runuser -u yugabyte --
      /home/yugabyte/bin/yugabyted start --background=false --callhome=false --insecure
      --advertise_address="$$YB_NODE" --cloud_location="local.dc1.$$YB_ZONE" --fault_tolerance=zone
      --base_dir=/home/yugabyte/var $${YB_JOIN:+--join=$$YB_JOIN}
      --master_flags=memory_limit_hard_bytes=335544320,yb_num_shards_per_tserver=1
      --tserver_flags=memory_limit_hard_bytes=1073741824,yb_num_shards_per_tserver=1,ysql_num_shards_per_tserver=1

services:
  yb_node1:
    <<: *yb
    container_name: yb_node1
    hostname: yb-node1
    environment: { YB_NODE: yb-node1, YB_ZONE: zone1 }
    ports: ["127.0.0.1:15471:5433","127.0.0.1:17001:7000"]
    volumes: [yb_data1:/home/yugabyte/var]
    networks: { yb_net: { aliases: [yb-node1] } }
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/yb-node1/5433 && </dev/tcp/yb-node1/7000'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  yb_node2:
    <<: *yb
    container_name: yb_node2
    hostname: yb-node2
    environment: { YB_NODE: yb-node2, YB_ZONE: zone2, YB_JOIN: yb-node1 }
    ports: ["127.0.0.1:15472:5433"]
    volumes: [yb_data2:/home/yugabyte/var]
    networks: { yb_net: { aliases: [yb-node2] } }
    depends_on: { yb_node1: { condition: service_healthy } }

  yb_node3:
    <<: *yb
    container_name: yb_node3
    hostname: yb-node3
    environment: { YB_NODE: yb-node3, YB_ZONE: zone3, YB_JOIN: yb-node1 }
    ports: ["127.0.0.1:15473:5433"]
    volumes: [yb_data3:/home/yugabyte/var]
    networks: { yb_net: { aliases: [yb-node3] } }
    depends_on: { yb_node1: { condition: service_healthy } }

volumes: { yb_data1: {}, yb_data2: {}, yb_data3: {} }
