networks:
  citus_net:
    driver: bridge

x-citus-node: &citus-node
  image: citusdata/citus:14.2.0-pg17
  restart: unless-stopped
  mem_limit: ${CITUS_MEM_LIMIT:-2048m}
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-${PG_LAB_PASSWORD:-pg_poc_ephemeral}}
    POSTGRES_DB: postgres
    PGUSER: postgres
  command:
    - postgres
    - -c
    - shared_preload_libraries=citus
    - -c
    - shared_buffers=${CITUS_SHARED_BUFFERS:-512MB}
    - -c
    - effective_cache_size=${CITUS_EFFECTIVE_CACHE_SIZE:-1536MB}
    - -c
    - work_mem=${PG_WORK_MEM:-16MB}
    - -c
    - maintenance_work_mem=${PG_MAINT_WORK_MEM:-128MB}
    - -c
    - max_connections=${PG_MAX_CONNECTIONS:-200}
    - -c
    - wal_compression=${PG_WAL_COMPRESSION:-lz4}
    - -c
    - wal_buffers=${PG_WAL_BUFFERS:-16MB}
    - -c
    - max_wal_size=${PG_MAX_WAL_SIZE:-2GB}
    - -c
    - checkpoint_completion_target=${PG_CHECKPOINT_COMPLETION_TARGET:-0.9}
    - -c
    - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
    - -c
    - effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-16}
    - -c
    - jit=${PG_JIT:-off}
    - -c
    - citus.shard_count=${CITUS_SHARD_COUNT:-32}
    - -c
    - citus.max_adaptive_executor_pool_size=${CITUS_MAX_ADAPTIVE_EXECUTOR_POOL_SIZE:-16}
    - -c
    - citus.multi_shard_modify_mode=${CITUS_MULTI_SHARD_MODIFY_MODE:-parallel}
    - -c
    - citus.local_shared_pool_size=${CITUS_LOCAL_SHARED_POOL_SIZE:-50}
    - -c
    - log_error_verbosity=verbose
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres"]
    interval: 5s
    timeout: 5s
    retries: 20
  networks:
    - citus_net

services:
  citus_coord:
    <<: *citus-node
    container_name: citus_coord
    hostname: citus_coord
    ports:
      - "127.0.0.1:15490:5432"
    volumes:
      - citus_coord_data:/var/lib/postgresql/data
    depends_on:
      citus_worker1:
        condition: service_healthy
      citus_worker2:
        condition: service_healthy

  citus_worker1:
    <<: *citus-node
    container_name: citus_worker1
    hostname: citus_worker1
    ports:
      - "127.0.0.1:15491:5432"
    volumes:
      - citus_worker1_data:/var/lib/postgresql/data

  citus_worker2:
    <<: *citus-node
    container_name: citus_worker2
    hostname: citus_worker2
    ports:
      - "127.0.0.1:15492:5432"
    volumes:
      - citus_worker2_data:/var/lib/postgresql/data

volumes:
  citus_coord_data:
  citus_worker1_data:
  citus_worker2_data:
