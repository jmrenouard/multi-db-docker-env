# Patroni PostgreSQL 17 HA configuration
# Node identity, connect addresses, and credentials are injected via PATRONI_* environment variables.
scope: patroni-cluster
namespace: /service/

restapi:
  listen: 0.0.0.0:8008
  certfile: /etc/patroni/certs/patroni-api.crt
  keyfile: /etc/patroni/certs/patroni-api.key
  cafile: /etc/patroni/certs/ca.crt
  verify_client: required

ctl:
  cacert: /etc/patroni/certs/ca.crt
  certfile: /etc/patroni/certs/patroni-api.crt
  keyfile: /etc/patroni/certs/patroni-api.key

etcd3:
  hosts:
    - etcd1:2379
    - etcd2:2379
    - etcd3:2379
  protocol: https
  cacert: /etc/patroni/certs/ca.crt
  cert: /etc/patroni/certs/etcd-client.crt
  key: /etc/patroni/certs/etcd-client.key

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        max_connections: 100
        max_wal_senders: 10
        max_replication_slots: 10
        wal_level: replica
        hot_standby: "on"
        wal_log_hints: "on"

  initdb:
    - encoding: UTF8
    - data-checksums

  pg_hba:
    - local all all trust
    - hostssl replication replicator 0.0.0.0/0 md5
    - hostssl replication replicator ::0/0 md5
    - hostssl all all 0.0.0.0/0 md5
    - hostssl all all ::0/0 md5

postgresql:
  listen: 0.0.0.0:5432
  data_dir: /datas/pgdata
  bin_dir: /usr/lib/postgresql/17/bin
  pgpass: /tmp/pgpass0
  authentication:
    replication:
      username: replicator
    superuser:
      username: postgres
  parameters:
    unix_socket_directories: /var/run/postgresql
    ssl: "on"
    ssl_cert_file: /etc/patroni/certs/postgresql-server.crt
    ssl_key_file: /etc/patroni/certs/postgresql-server.key
    ssl_ca_file: /etc/patroni/certs/ca.crt
